<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Page Moved</title>
  <!-- 1. Instant client-side redirect for browsers -->
  <meta http-equiv="refresh" content="0; url=https://thepivotgame.github.io/pivot-ICF">
  <!-- 2. Tells search engines that index.html is the authoritative source -->
  <link rel="canonical" href="https://thepivotgame.github.io/pivot-ICF">
  
  <script>
    // 3. JavaScript fallback backup if meta refresh is disabled
    window.location.replace("https://thepivotgame.github.io/pivot-ICF");
  </script>
</head>
<body>
  <p>The game has been moved to the homepage. <a href="https://thepivotgame.github.io/pivot-ICF">Click here if you are not redirected</a>.</p>
</body>
</html>
